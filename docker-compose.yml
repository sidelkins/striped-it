services:
  swingspeed:
    build: .
    image: swingspeed:latest
    container_name: swingspeed
    ports:
      - "${SWINGSPEED_PORT:-8080}:8080"
    environment:
      PORT: 8080
      HOST: 0.0.0.0
    restart: unless-stopped
    # The server only serves static files, so lock the container down.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
